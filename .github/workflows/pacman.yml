name: Generate Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: anna29beatrizweb

      - name: Move generated files
        run: |
          mkdir -p pacman-output
          cp dist/pacman-contribution-graph.svg pacman-output/pacman-contribution-graph.svg
          cp dist/pacman-contribution-graph-dark.svg pacman-output/pacman-contribution-graph-dark.svg

      - name: Commit Pac-Man
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pacman-output/
          git commit -m "Update Pac-Man contribution graph" || exit 0
          git push
