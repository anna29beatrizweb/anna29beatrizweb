name: Generate GitHub Languages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=anna29beatrizweb&layout=compact&langs_count=6&theme=midnight-purple&hide_title=false&hide_border=false&locale=en
          path: languages-output/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit languages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages-output/languages.svg
          git commit -m "Update GitHub languages" || exit 0
          git push
